name: Deploy Discord bot to Supabase

# Lädt die beiden Bot-Funktionen (discord-interactions, discord-dispatch) zu
# Supabase hoch, sobald sich ihr Code auf main ändert (Fausto 07.11.2026).
# Grund: Die Dateien sind zu groß (95/74 KB) für einen Deploy über den
# Supabase-Connector, und Claudes Umgebungen erreichen die Supabase-API nicht.
#
# Voraussetzung (einmalig): GitHub › Settings › Secrets and variables › Actions
#   › Secret SUPABASE_ACCESS_TOKEN (Supabase › Account › Access Tokens).
# Der Schlüssel steht nie in einer Datei; GitHub blendet ihn in Logs aus.
#
# Nur diese zwei Funktionen. Alle anderen werden weiter einzeln deployt.
# Beide laufen mit verify_jwt = false (Discord signiert selbst; Cron ruft
# discord-dispatch ohne Login auf) – wie live seit Oktober 2026.
#
# Ablauf: geänderte Funktion ermitteln → Syntax prüfen (esbuild, nur Parsen)
# → hochladen. Schlägt die Prüfung fehl, wird nichts hochgeladen.
# Von Hand: Actions › "Deploy Discord bot to Supabase" › Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/discord-interactions/**'
      - 'supabase/functions/discord-dispatch/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Which function to deploy'
        type: choice
        options: [both, discord-interactions, discord-dispatch]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy-bot
  cancel-in-progress: false

env:
  PROJECT_REF: pprzkexqltudeuqjnsqa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which functions changed
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          ALL="discord-interactions discord-dispatch"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            choice="${{ github.event.inputs.function }}"
            if [ "$choice" = "both" ]; then list="$ALL"; else list="$choice"; fi
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              list="$ALL"
            else
              list=""
              for f in $ALL; do
                if ! git diff --quiet "$before" "${{ github.sha }}" -- "supabase/functions/$f"; then list="$list $f"; fi
              done
            fi
          fi
          list="$(echo $list)"
          echo "Functions: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.list != ''
        with:
          node-version: '22'

      - name: Syntax check (nothing is deployed if this fails)
        if: steps.pick.outputs.list != ''
        shell: bash
        run: |
          set -euo pipefail
          for f in ${{ steps.pick.outputs.list }}; do
            echo "Checking $f"
            npx --yes esbuild@0.24.0 "supabase/functions/$f/index.ts" --log-level=error > /dev/null
          done

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.list != ''
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.list != ''
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Secret SUPABASE_ACCESS_TOKEN fehlt (GitHub › Settings › Secrets and variables › Actions)."; exit 1
          fi
          for f in ${{ steps.pick.outputs.list }}; do
            echo "Deploying $f"
            supabase functions deploy "$f" --remote="$PROJECT_REF" --no-verify-jwt --yes
          done
