name: Deploy site to GitHub Pages

# Baut site/ (Astro, gellhorn-v2) und deployed nach GitHub Pages.
# Voraussetzung (einmalig, im Repo-Besitzer-Account):
#   - Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   - Secrets: SUPABASE_URL, SUPABASE_ANON_KEY, PUBLIC_SUBMIT_LAP_URL, PUBLIC_MODERATE_SUBMISSION_URL
#     (siehe SETUP-BACKEND.md; SUPABASE_URL/ANON_KEY sind dieselben Werte
#     wie fuer build-snapshot.yml, nur hier zusaetzlich mit PUBLIC_-Praefix
#     ins Build gereicht, weil Astro sie client-seitig in die Submit-Seite
#     einbacken muss)
#
# Base-Path-Hinweis: Die Seite laeuft seit 2026-09-27 auf der eigenen Domain
# leonidaracing.com (Custom Domain in den Pages-Einstellungen), daher kein
# `base` in astro.config.mjs. Repo heisst seit 2026-10-04 `leonida-racing`.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}
  # RS-0052: vehicle data lives in Supabase; rebuild regularly so moderator
  # edits (Moderator > Vehicles) go live without a push.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Fetch vehicle data from Supabase (RS-0052)
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/fetch-vehicles.mjs

      - name: Build
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_SUBMIT_LAP_URL: ${{ secrets.PUBLIC_SUBMIT_LAP_URL }}
          PUBLIC_MODERATE_SUBMISSION_URL: ${{ secrets.PUBLIC_MODERATE_SUBMISSION_URL }}
        run: npx astro build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
